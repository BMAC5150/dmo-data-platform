name: Corrida mensual (demo)

on:
  workflow_dispatch:
    inputs:
      brief:
        description: "Quién redacta el informe"
        type: choice
        options: [api, archivo]
        default: api

permissions:
  contents: read

concurrency:
  group: corrida-y-pagina
  cancel-in-progress: false

jobs:
  corrida:
    name: Corrida Ixtapa-Zihuatanejo (DATOS SINTÉTICOS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código y los datos
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar las reglas fijas
        run: python tests/test_engine.py

      - name: Correr el motor y redactar el informe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODE: ${{ inputs.brief == 'archivo' && 'file' || 'api' }}
          CLAUDE_MODEL: claude-sonnet-5-5
        run: python src/build_results.py

      - name: Guardar los resultados de la corrida
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: Preparar la página para publicar
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

  publicar:
    name: Publicar la página (GitHub Pages)
    needs: corrida
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
