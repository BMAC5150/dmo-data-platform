name: Publicar sin correr (demo)

# Republishes the site of an earlier run exactly as it was, plus the partner portal at /portal/ and the two
# 16:9 views (Vista Tablero / Vista Resumen), shown at the top of the Tablero tab with a button to switch between
# them in place, and the Guía de prospección tab (guia/, real public data for the destination); nothing else on the page changes.
# Does not run the engine or call the Claude API: the dashboard and the brief stay byte for byte the same.

on:
  workflow_dispatch:
    inputs:
      corrida:
        description: "Número de la corrida a republicar (vacío = la última que terminó bien)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: corrida-y-pagina
  cancel-in-progress: false

jobs:
  preparar:
    name: Republicar la página de una corrida anterior + portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el portal
        uses: actions/checkout@v7

      - name: Traer la página publicada por esa corrida
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ inputs.corrida }}
        run: |
          if [ -z "$NUM" ]; then
            NUM=$(gh run list -R "$GITHUB_REPOSITORY" --workflow run.yml --status success -L 1 --json number -q '.[0].number')
          fi
          ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow run.yml -L 100 --json number,databaseId -q ".[] | select(.number == $NUM) | .databaseId")
          echo "Corrida #$NUM (id $ID)"
          gh run download "$ID" -R "$GITHUB_REPOSITORY" -n "resultados-$NUM" -D prev
          test -f prev/site/index.html
          echo "### Republicada la página de la corrida #$NUM, sin cambios, más el portal en /portal/" >> "$GITHUB_STEP_SUMMARY"

      - name: Añadir el portal
        run: |
          mkdir -p prev/site/portal
          cp portal/index.html prev/site/portal/index.html

      - name: Añadir la página de acceso (login)
        run: |
          mkdir -p prev/site/login
          cp login/index.html prev/site/login/index.html

      - name: Añadir la página de presentación (pitch), que se abre al entrar
        run: |
          mkdir -p prev/site/pitch
          cp pitch/index.html prev/site/pitch/index.html

      - name: Añadir Vista Tablero y Vista Resumen (16:9)
        run: |
          python3 tools/add_presentation_views.py prev/site
          echo "Más Vista Tablero / Vista Resumen arriba de la pestaña Tablero (ES y EN)" >> "$GITHUB_STEP_SUMMARY"

      - name: Añadir la Guía de prospección (pestaña nueva)
        run: |
          python3 tools/add_targeting_guide.py prev/site
          echo "Más la pestaña Guía de prospección / Targeting guide (ES y EN)" >> "$GITHUB_STEP_SUMMARY"

      - name: Aplicar la marca Ocelo (solo presentación)
        run: |
          python3 tools/apply_brand.py prev/site
          echo "Marca Ocelo aplicada: colores, tipografía y logotipo; ninguna cifra cambia" >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar la página para publicar
        uses: actions/upload-pages-artifact@v5
        with:
          path: prev/site

  publicar:
    name: Publicar la página (GitHub Pages)
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
