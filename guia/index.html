<style>

:root{
  --ocean:#0e2a33; --teal:#00839b; --gold:#c9801a; --mist:#f3f6f5; --white:#fff; --ink:#14262c; --ink2:#34484f; --muted:#5d7178;
  --line:#dfe6e6; --soft:#edf1f1; --up:#0a7b5c; --down:#b23a2b; --warn:#a15c07; --warn-bg:#fdf3e2; --ok-bg:#e6f3ee; --teal-l:#e0f0f3;
  --rain:#3e6fa8; --syn:#7d3c98; --syn-l:#f5ecf8;
  --display:"Outfit","Avenir Next","Segoe UI",sans-serif; --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:400 15px/1.55 var(--sans);font-feature-settings:"tnum" 1,"lnum" 1}
.wrap{max-width:1180px;margin:0 auto;padding:36px 28px 48px}
.embed .wrap{max-width:none;padding:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin:0 0 16px}

.lead-in h2{font:400 28px/1.2 var(--display);margin:0 0 8px;color:var(--ocean);letter-spacing:-.015em}

.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.lang button{appearance:none;border:0;background:none;font:600 12.5px var(--sans);color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer;letter-spacing:.03em}
.lang button.on{background:var(--ocean);color:#fff}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:9px 16px;font-size:13px;font-weight:600;margin:0 0 14px}
.legend-badges{display:flex;gap:8px 16px;flex-wrap:wrap;margin:0 0 22px;font-size:13px;color:var(--muted);align-items:center}
.badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.badge.real{background:var(--teal-l);color:#00677a}

.tip b{display:block;margin-bottom:2px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:16px}
.gw{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}

.st-target{background:var(--ok-bg);color:var(--up)}.st-watch{background:var(--soft);color:#475a60}.st-notyet{background:#f8e4e1;color:var(--down)}

.card-h h4{margin:0;font:500 17px/1.3 var(--display);color:var(--ocean)}
.card-b{padding:14px 18px 16px;flex:1}
.seg{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:4px;white-space:nowrap}
.big{display:flex;gap:18px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap}
.big .n{font:300 30px/1 var(--display);color:var(--teal);letter-spacing:-.02em}
.big .u{font-size:12.5px;color:var(--muted)}
.checks{display:grid;gap:7px;margin-bottom:10px}
.chk{display:flex;gap:9px;font-size:13.5px;line-height:1.38;color:var(--ink)}
.chk .ic{flex:0 0 22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
.ic-room{background:var(--teal-l)}.ic-air{background:#e6eef8}.ic-wx{background:#fbe3dc}.ic-gw{background:var(--soft)}
.chk.ok .ic-wx{background:var(--ok-bg)}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin:2px 0 12px}
.months span{font-size:10px;text-align:center;padding:4px 0;border-radius:4px;background:var(--soft);color:var(--muted)}
.months span.on{background:#2e9e64;color:#fff;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--syn-l);color:var(--syn);border:1px dashed #c9a3d4}
.pitch{font-size:13px;color:var(--up);margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.notyet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.ny{border:1px solid #efcfc8;background:#fdf6f4;border-radius:12px;padding:12px 16px}
.ny h4{margin:0 0 3px;font:600 14.5px var(--sans);color:var(--down)}
.ny p{margin:0;font-size:13.5px;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.m{border:1px solid var(--line);border-radius:12px;padding:11px 12px 12px;min-height:116px;background:#fff}
.m h4{margin:0 0 6px;font:500 15px var(--display);color:var(--ocean);display:flex;justify-content:space-between;align-items:center;gap:6px}
.m h4 small{font:700 10px var(--sans);padding:2px 7px;border-radius:999px;text-align:right}
.pill{display:block;border-radius:8px;font-size:12.5px;padding:4px 8px;margin:5px 0;line-height:1.3}
.pill.p{background:var(--ok-bg);color:var(--up)}
.pill.h{background:#fff;border:1px solid #a7d8be;color:var(--up)}
.pill em{font-style:normal;font-weight:700}
.quiet{font-size:12.5px;color:var(--muted);margin-top:4px}
ul.app{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:14px 26px}
ul.app li{display:flex;gap:12px}
ul.app svg{flex:0 0 24px;margin-top:1px}
ul.app h4{margin:0 0 2px;font:600 15px var(--sans)}
ul.app p{margin:0;font-size:14px;color:var(--muted)}
table.syn{width:100%;border-collapse:collapse;font-size:14px}
table.syn th{text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
table.syn td{padding:11px 10px;border-bottom:1px solid var(--soft)}
table.syn td.n{font-weight:600}
.synwrap{border:1px dashed var(--syn);border-radius:12px;padding:4px 8px;background:#fdfafe;overflow-x:auto}
footer{color:var(--muted);font-size:12.5px;line-height:1.6}
footer ul{margin:6px 0 0;padding-left:18px}
@media (max-width:760px){
  .wrap{padding:24px 18px 36px}.embed .wrap{padding:0}
  .lead-in h2{font-size:24px}.cal{grid-template-columns:repeat(2,1fr)}
  .storm div,.tags div{font-size:0;min-height:14px;height:14px;padding:0;border-radius:3px}
  .mlab{font-size:9px}

<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script>
/* =====================================================================
   DATA
   Real: destination file "20261103_Datos Zihuatanejo 2024-2026" (Datatur, AFAC, OAG);
   CVB "Ixtapa Zihuatanejo Statistical Data 2009-2025" (hotel association origin);
   destination weather profile (climate normals, supplied 14 Nov 2026).
   Estimate: May-Oct seats. Expert rule: segments, sizes, booking windows.
   SYNTHETIC: industries and the track-record table.
   ===================================================================== */
const ROOMS = 6800;                 // Datatur room base
const ROOMS_PER_ATTENDEE = 0.8;     // planning norm (Segment Fit paper)
const LF = { mid:0.78, lo:0.85, hi:0.70 };  // assumed load factors for the May-Oct seat guesstimate
const OCC = {   // Datatur monthly occupancy %, 2026 = Jan-Aug
  2024: [65.72,64.39,67.14,60.8,58.72,60.74,67.47,58.09,44.83,46.88,61.29,71.21],
  2025: [68.91,65.07,60.95,66.15,65.27,55.46,64.61,63.13,44.15,51.86,64.11,69.05],
  2026: [68.49,66.15,54.73,57.14,58.14,48.08,57.63,61.6]
};
// AFAC commercial arrivals by country of flight origin, 2026 = Jan-Sep
const CAN = { 2024:[3559,3132,2667,1412,0,0,0,0,0,305,2033,3817], 2025:[5212,4047,3157,1030,0,0,0,0,0,368,3539,4468], 2026:[6310,5061,3869,1448,0,0,0,0,0] };
const USA = { 2024:[11799,11884,12094,5059,3248,3819,3752,2192,1422,2404,6566,11059], 2025:[11363,10350,9916,4448,3049,3314,3148,2050,1320,2563,5170,10679], 2026:[11279,9771,8267,3823,2831,2864,2943,1449,817] };
const MEX = { 2024:[17087,16948,20314,15366,16949,18694,21444,19471,14847,17739,17746,22218], 2025:[18541,17462,18785,22669,22444,20814,26694,24283,17960,19897,23541,27593], 2026:[23317,21439,25385,22651,24320,21542,27181,26064,16919] };
// OAG seats filed 1 Nov 2026 (index 0 = Jan): Nov-Dec 2026, Jan-Apr 2027
const SEATS_CAN = {10:3666, 11:4983, 0:5295, 1:4896, 2:5202, 3:3816};
const SEATS_USA = {10:5100, 11:8302, 0:10884, 1:8707, 2:10764, 3:5436};
const WINTER = [10,11,0,1,2,3];
const NIGHTS = { // hotel association, Jan-Nov 2025
  mexico:828012, usa:56546, canada:25276, total:912219, latam:579, europe:1305,
  michoacan:302747, guanajuato:183519, queretaro:56935, aguascalientes:19653, slp:17085,
  cdmx:79561, edomex:71864, jalisco:25872, nuevoleon:5788,
  california:21465, minnesota:4954, illinois:3964, wisconsin:2651, bc:8815, alberta:7955
};
// Weather profile (climate normals)
const RAIN_DAYS = [1,0,0,0,2,13,12,14,16.5,8,1.5,1];          // midpoint of the profile's range
const RAIN_TXT  = ["1","0","0","0","2","12–14","11–13","13–15","15–18","7–9","1–2","1"];
const RAIN_MM   = [11,5,8,1,20,198,165,216,330,140,20,8];
const STORM     = [0,0,0,0,1,2,2,3,4,3,1,0];                   // none, very low, moderate, high, peak
const DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];

/* ---------- derived ---------- */
const sum = a => a.reduce((s,v)=>s+v,0);
const avgOcc = Array.from({length:12},(_,i)=>{ const v=[2024,2025,2026].map(y=>OCC[y][i]).filter(x=>x!=null); return sum(v)/v.length; });
const emptyRooms = avgOcc.map(o => Math.round(ROOMS*(1-o/100)));
// latest 12 months of international arrivals: Nov-Dec 2025, Jan-Sep 2026, Oct 2025
const intlArr = m => { const y = (m>=9) ? 2025 : 2026; return CAN[y][m]+USA[y][m]; };
const seatsIntl = m => SEATS_CAN[m]+SEATS_USA[m];
const isWinter = m => WINTER.includes(m);
const r10 = v => Math.round(v/10)*10;
const estSeats = m => ({ mid:r10(intlArr(m)/LF.mid), lo:r10(intlArr(m)/LF.lo), hi:r10(intlArr(m)/LF.hi) });
const seatsAny = m => isWinter(m) ? seatsIntl(m) : estSeats(m).mid;
const seatGap = m => Math.round(100*(seatsIntl(m)/intlArr(m)-1));
const pctChg = (a,b) => Math.round(100*(b/a-1));
const canChg = pctChg(sum(CAN[2025].slice(0,9)), sum(CAN[2026]));
const usaChg = pctChg(sum(USA[2025].slice(0,9)), sum(USA[2026]));
const share = (n,d) => 100*n/d;
const SH = {
  michBajio: share(NIGHTS.michoacan+NIGHTS.guanajuato+NIGHTS.queretaro+NIGHTS.aguascalientes+NIGHTS.slp, NIGHTS.mexico),
  cdmx: share(NIGHTS.cdmx+NIGHTS.edomex, NIGHTS.mexico),
  jalNl: share(NIGHTS.jalisco+NIGHTS.nuevoleon, NIGHTS.mexico),
  wcan: share(NIGHTS.bc+NIGHTS.alberta, NIGHTS.canada),
  cal: share(NIGHTS.california, NIGHTS.usa),
  midw: share(NIGHTS.minnesota+NIGHTS.illinois+NIGHTS.wisconsin, NIGHTS.usa),
  latam: share(NIGHTS.latam, NIGHTS.total),
  latEu: share(NIGHTS.latam+NIGHTS.europe, NIGHTS.total)
};
const weekSeatsCan = m => SEATS_CAN[m]/DAYS[m]*7;
const weekDomArr = m => MEX[2025][m]/DAYS[m]*7;
const roomsFor = att => Math.round(att*ROOMS_PER_ATTENDEE);
const roomPct = (att,m) => Math.round(100*roomsFor(att)/emptyRooms[m]);
const fmt = n => Math.round(n).toLocaleString("en-US");
const fk = n => (Math.round(n/100)/10).toFixed(1)+"k";
const r1 = n => n.toFixed(1);
const wetShare = Math.round(100*sum(RAIN_MM.slice(5,10))/sum(RAIN_MM));

/* ---------- text ---------- */
const MON = { en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], es:["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"] };
const MONL = { en:["January","February","March","April","May","June","July","August","September","October","November","December"], es:["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"] };
const L = (en,es)=>({en,es});
const cap1 = s => s.charAt(0).toUpperCase()+s.slice(1);

const T = {
  demo: L("Unlike the rest of this demo, this guide uses real public data for Ixtapa-Zihuatanejo, alongside labelled estimates and synthetic examples. Not an official destination document.",
          "A diferencia del resto de esta demo, esta guía usa datos públicos reales de Ixtapa-Zihuatanejo, junto con estimaciones y ejemplos sintéticos señalados. No es un documento oficial del destino."),
  eyebrow: L("Business events · Lead targeting guide","Eventos de negocios · Guía de prospección"),
  title: L("Business events targeting guide","Guía de prospección de eventos de negocios"),
  sub: L("Which groups to pursue, from where and when: hotels, flights and weather, month by month.",
         "Qué grupos buscar, de dónde y cuándo: hoteles, vuelos y clima, mes a mes."),
  real: L("Real data","Datos reales"), est: L("Estimate","Estimación"), rule: L("Expert rule","Regla experta"), syn: L("Synthetic","Sintético"),
  realD: L("public statistics","estadísticas públicas"), estD: L("calculated guess","cálculo aproximado"), ruleD: L("professional judgment","criterio profesional"), synLeg: L("invented for the demo","inventado para la demo"),
  k1: L("hotel rooms","cuartos de hotel"),
  k2: L("of Mexican hotel nights from Michoacán and the Bajío, mostly by road","de las noches nacionales vienen de Michoacán y el Bajío, casi todo por carretera"),
  k3: L("Canadian air arrivals, Jan–Sep 2026","llegadas aéreas desde Canadá, ene–sep 2026"),
  k4: L("September occupancy: the emptiest month, and peak hurricane risk","ocupación en septiembre: el mes más vacío y de mayor riesgo de huracán"),
  whenT: L("When there's room","Cuándo hay espacio"),
  whenD: L("Groups fit where empty rooms, flights and dry weather overlap. They rarely line up.","Los grupos encajan donde coinciden cuartos vacíos, vuelos y clima seco. Rara vez coinciden."),
  c1: L("Empty hotel rooms, average night","Cuartos de hotel vacíos, noche promedio"),
  c1cap: L("6,800 rooms × (1 − occupancy), 2024–26 average. Weekends run fuller: target midweek.","6,800 cuartos × (1 − ocupación), promedio 2024–26. Los fines de semana se llenan más: buscar entre semana."),

function useTip() {
  const box = useRef(null);
  const [tip, setTip] = useState(null);
  const show = useCallback((e, lines) => {
    const r = box.current.getBoundingClientRect();
    let x = e.clientX - r.left + 12, y = e.clientY - r.top - 10;
    if (x + 230 > r.width) x = Math.max(0, e.clientX - r.left - 230);
    setTip({ x, y, lines });
  }, []);
  const hide = useCallback(() => setTip(null), []);
  const node = tip && html`<div class="tip" style=${{left:tip.x+"px", top:tip.y+"px"}}>${tip.lines.map((l,i)=> i===0 ? html`<b>${l}</b>` : html`<div>${l}</div>`)}</div>`;
  return { box, show, hide, node };
}

        return html`<g key=${i}>
          <path d=${roundTop(cx-bw-gap/2,base,y(s),bw,3)} fill=${win ? "#00839B" : "url(#hatch)"}/>
          <path d=${roundTop(cx+gap/2,base,y(a),bw,3)} fill="#c9801a"/>
          <text x=${cx} y=${top-8} text-anchor="middle" font-size=${win?13:12} font-weight=${win?700:600} fill=${win && seatGap(i)<0 ? "#9A3B22" : (win ? "#0E2A33" : "#2D5689")}>${label}</text>
          <text x=${cx} y=${H-5} text-anchor="middle" font-size="12.5" fill="#5d7178">${m}</text>
          <rect x=${i*BAND} y="0" width=${BAND} height=${H} fill="transparent" onPointerMove=${ev=>t.show(ev,lines)} onPointerLeave=${t.hide}/>
        </g>`;
      })}
    </svg>${t.node}</div>`;
}

function WeatherChart({ lang }) {
  const t = useTip();
  const H = 130, T0 = 22, B = 4, bw = BAND*0.62, max = 18, base = H-B;
  const y = v => T0 + (base-T0)*(1 - v/max);
  return html`<div class="chart-box" ref=${t.box}>
    <svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${T.c3[lang]+": "+RAIN_TXT.map((v,i)=>MON[lang][i]+" "+v).join(", ")}>
      <line x1="0" x2=${W} y1=${base} y2=${base} stroke="#b9c6c9"/>
      ${RAIN_DAYS.map((v,i)=>{ const x = i*BAND+(BAND-bw)/2, top = y(v);
        return html`<g key=${i}>
          ${v>0 && html`<path d=${roundTop(x,base,top,bw,Math.min(4,(base-top)/2))} fill="#3e6fa8"/>`}
          <text x=${x+bw/2} y=${(v>0?top:base)-7} text-anchor="middle" font-size="12.5" font-weight="600" fill="#14262c">${RAIN_TXT[i]}</text>
          <rect x=${i*BAND} y="0" width=${BAND} height=${H} fill="transparent"
            onPointerMove=${e=>t.show(e,[cap1(MONL[lang][i]), RAIN_TXT[i]+" "+T.rainT[lang], RAIN_MM[i]+" mm "+T.mmT[lang], T.stormRow[lang]+": "+T.stormLv[STORM[i]][lang]])} onPointerLeave=${t.hide}/>
        </g>`; })}
    </svg>
    <div class="row12 storm" style=${{marginTop:"4px"}} aria-label=${T.stormRow[lang]}>${STORM.map((s,i)=>html`<div key=${i} class=${"s"+s} title=${MONL[lang][i]+": "+T.stormLv[s][lang]}>${T.stormLv[s][lang]}</div>`)}</div>
    <div class="row12">${MON[lang].map(m=>html`<div class="mlab">${m}</div>`)}</div>
    ${t.node}</div>`;
}

function Profile({ p, lang }) {
  const rooms = roomsFor(p.max), pct = roomPct(p.max, p.roomM);
  return html`<div class="card">
    <div class="card-h"><h4>${p.name[lang]}</h4><div>${p.segs.map(s=>html`<span class="seg" style=${{background:SEGCOL[s][0],color:SEGCOL[s][1]}}>${SEGN[s][lang]}</span>`)}</div></div>
    <div class="card-b">
      <div class="big"><div><span class="n">${p.att}</span> <span class="u">${T.att[lang]}</span></div></div>
      <div class="months">${MON[lang].map((m,i)=>html`<span class=${(p.months.includes(i)?"on ":"")+(isWet(i)?"wet":"")} title=${MONL[lang][i]}>${m[0]}</span>`)}</div>
      <div class="checks">
        <div class="chk"><span class="ic ic-gw">📍</span><span>${p.gw[lang]}</span></div>
        <div class="chk"><span class="ic ic-room">🛏</span><span>${T.roomTxt[lang](fmt(rooms), pct, MONL[lang][p.roomM])}</span></div>
        <div class="chk"><span class="ic ic-air">✈</span><span>${val(p.air,lang)}</span></div>
        <div class=${"chk"+(p.wxOk?" ok":"")}><span class="ic ic-wx">${p.wxOk ? "☀" : "☂"}</span><span>${p.wx[lang]}</span></div>
      </div>
      <div class="chips">${p.ind.map(x=>html`<span>${x[lang]}</span>`)}</div>
      <div class="pitch"><b>${T.fPitch[lang]}:</b> ${val(p.pitch,lang)}</div>
    </div></div>`;
}

const check = html`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00839B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.1V12a9 9 0 1 1-5.3-8.2"/><path d="M21 4 12 13l-3-3"/></svg>`;

function App() {
  const [lang, setLangState] = useState(START_LANG);
  const setLang = l => { setLangState(l); try { localStorage.setItem("dmo-lang", l); } catch(e) {} document.documentElement.lang = l; };
  const stCls = { target:"st-target", watch:"st-watch", notyet:"st-notyet" };
  const stLab = { target:T.stTarget, watch:T.stWatch, notyet:T.stNot };
  const sepOcc = (OCC[2024][8]+OCC[2025][8])/2;
  return html`<div class="wrap">
    <div class="top">
      <div class="lead-in"><h2>${T.title[lang]}</h2><p>${T.sub[lang]}</p></div>
      ${!EMBED && html`<div class="lang" role="group" aria-label="Idioma / Language">
        <button class=${lang==="es"?"on":""} onClick=${()=>setLang("es")}>ES</button>
        <button class=${lang==="en"?"on":""} onClick=${()=>setLang("en")}>EN</button>
      </div>`}
    </div>
    <div class="demo">${T.demo[lang]}</div>
    <div class="legend-badges">
      <span><${Badge} k="real" lang=${lang}/> ${T.realD[lang]}</span>
      <span><${Badge} k="est" lang=${lang}/> ${T.estD[lang]}</span>
      <span><${Badge} k="rule" lang=${lang}/> ${T.ruleD[lang]}</span>
      <span><${Badge} k="syn" lang=${lang}/> ${T.synLeg[lang]}</span>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="v">${fmt(ROOMS)}</div><div class="d">${T.k1[lang]}</div><${Badge} k="real" lang=${lang}/></div>
      <div class="kpi"><div class="v">${Math.round(SH.michBajio)}%</div><div class="d">${T.k2[lang]}</div><${Badge} k="real" lang=${lang}/></div>
      <div class="kpi"><div class="v">+${canChg}%</div><div class="d">${T.k3[lang]}</div><${Badge} k="real" lang=${lang}/></div>
      <div class="kpi"><div class="v">${r1(sepOcc)}%</div><div class="d">${T.k4[lang]}</div><${Badge} k="real" lang=${lang}/></div>
    </div>

    <section class="panel">
      <div class="ph"><h2>${T.whenT[lang]}</h2><${Badge} k="real" lang=${lang}/><${Badge} k="est" lang=${lang}/></div>
      <p class="pdesc">${T.whenD[lang]}</p>

      <div class="chart-title">🛏 ${T.c1[lang]}</div>
      <${EmptyRoomsChart} lang=${lang}/>
      <p class="cap">${T.c1cap[lang]}</p>

      <div class="chart-title">✈ ${T.c2[lang]}</div>
      <div class="series-legend">
        <span><i style=${{background:"#00839B"}}></i>${T.s1[lang]}</span>
        <span><i class="hatch"></i>${T.s1e[lang]} <${Badge} k="est" lang=${lang}/></span>
        <span><i style=${{background:"#c9801a"}}></i>${T.s2[lang]}</span>
      </div>
      <${SeatsChart} lang=${lang}/>
      <p class="cap">${T.c2cap[lang]}</p>

      <div class="chart-title">☂ ${T.c3[lang]}</div>
      <${WeatherChart} lang=${lang}/>
      <p class="cap">${T.c3cap[lang]}</p>

      <div class="verdict">
        <div class="vt">${T.verdict[lang]}</div>
        <div class="row12 tags">${VERDICT.map((s,i)=>html`<div key=${i} class=${"t-"+s} title=${s==="none"?"":T.tag[s][lang]}>${s==="none" ? "" : T.tag[s][lang]}</div>`)}</div>
        <div class="row12">${MON[lang].map(m=>html`<div class="mlab">${m}</div>`)}</div>
      </div>
    </section>

    <section class="panel">
      <div class="ph"><h2>${T.gwT[lang]}</h2><${Badge} k="real" lang=${lang}/></div>
      <p class="pdesc">${T.gwD[lang]}</p>
      <div class="grid3">${GATEWAYS.map(g=>html`<div class="gw">
        <div class="row"><h3>${g.name[lang]}</h3><span class=${"status "+stCls[g.st]}>${stLab[g.st][lang]}</span></div>
        <div class="share"><b>${Math.round(g.share)}%</b><div class="bar"><span style=${{width:g.share+"%"}}></span></div></div>
        <div class="of">${g.of[lang]}</div>
        <div class="kv"><span class="ic">🧭</span><span>${g.access[lang]}</span></div>
        <div class="kv"><span class="ic">✈</span><span>${g.flights[lang]}</span></div>
      </div>`)}</div>
    </section>

    <section class="panel">
      <div class="ph"><h2>${T.profT[lang]}</h2><${Badge} k="rule" lang=${lang}/><${Badge} k="real" lang=${lang}/><${Badge} k="syn" lang=${lang}/></div>
      <p class="pdesc">${T.profD[lang]} <span style=${{color:"#3e6fa8"}}>${T.wetKey[lang]}</span>.</p>
      <div class="tierhead"><span class="tier tier1">${T.tier1[lang]}</span><h3>${T.tier1h[lang]}</h3></div>
      <div class="grid2">${PROFILES.filter(p=>p.tier===1).map(p=>html`<${Profile} p=${p} lang=${lang}/>`)}</div>
      <div class="tierhead"><span class="tier tier2">${T.tier2[lang]}</span><h3>${T.tier2h[lang]}</h3></div>
      <div class="grid2">${PROFILES.filter(p=>p.tier===2).map(p=>html`<${Profile} p=${p} lang=${lang}/>`)}</div>
      <div class="tierhead"><span class="tier tier0">${T.tier0[lang]}</span><h3>${T.tier0h[lang]}</h3></div>
      <div class="notyet">${NOTYET.map(n=>html`<div class="ny"><h4>${n.t[lang]}</h4><p>${n.d[lang]}</p></div>`)}</div>
    </section>

    <section class="panel">
      <div class="ph"><h2>${T.calT[lang]}</h2><${Badge} k="rule" lang=${lang}/></div>
      <p class="pdesc">${T.calD[lang]}</p>
      <div class="cal">${MONL[lang].map((m,i)=>{
        const s = VERDICT[i], items = CAL[i] || [];
        return html`<div class="m" key=${i}>
          <h4>${cap1(m)}${s!=="none" && html`<small class=${"t-"+s}>${T.tag[s][lang]}</small>`}</h4>
          ${items.length ? items.map(([k,pi,f])=> k==="p"
              ? html`<span class="pill p"><em>${T.pitch[lang]}:</em> ${PROFILES[pi].short[lang]} · ${T.forM[lang]} ${f[lang]}</span>`
              : html`<span class="pill h"><em>${T.host[lang]}:</em> ${PROFILES[pi].short[lang]}</span>`)
            : html`<div class="quiet">${T.calNone[lang]}</div>`}
        </div>`;
      })}</div>
    </section>

    <section class="panel">
      <div class="ph"><h2>${T.appT[lang]}</h2><${Badge} k="rule" lang=${lang}/></div>
      <ul class="app">${APPROACHES.map(a=>html`<li>${check}<div><h4>${a.h[lang]}</h4><p>${a.p[lang]}</p></div></li>`)}</ul>
    </section>

    <section class="panel">
      <div class="ph"><h2>${T.synT[lang]}</h2><${Badge} k="syn" lang=${lang}/></div>
      <p class="pdesc">${T.synD[lang]}</p>
      <div class="synwrap"><table class="syn">
        <thead><tr><th>${T.thSeg[lang]}</th><th>${T.thGrp[lang]}</th><th>${T.thPick[lang]}</th><th>${T.thWin[lang]}</th><th>${T.thRate[lang]}</th><th>${T.thRn[lang]}</th><th>${T.thLoss[lang]}</th></tr></thead>
        <tbody>${SYN.map(r=>html`<tr>
          <td>${PROFILES[r.p].name[lang]}</td><td class="n">${r.grp}</td><td class="n">${r.pick}%</td>
          <td class="n">${r.win} ${T.mo[lang]}</td><td class="n">${r.rate}%</td><td class="n">${fmt(r.rn)}</td><td>${r.loss[lang]}</td></tr>`)}</tbody>
      </table></div>
    </section>

    <footer><b>${T.srcT[lang]}</b><ul>${T.src.map(s=>html`<li>${s[lang]}</li>`)}</ul></footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);

/* Inside the platform page this guide sits in an iframe: tell the page how tall it is. */
if (EMBED && window.parent !== window) {
  const send = () => { try { window.parent.postMessage({ guia: "h", h: document.documentElement.scrollHeight }, location.origin); } catch (e) {} };
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
  window.addEventListener("load", send);
  send();
}
</script>
</body>
</html>
