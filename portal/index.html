<style>
/* Layout: ocean header with the gold horizon line, four entry cards (2 x 2) on sea-mist, forms open in place (hash views). Same tokens as the demo's "Costa Grande" design. */
:root {
  --ocean: #0e2a33; --teal: #00839b; --gold: #c9801a; --horizon: #e8a63c;
  --mist: #f3f6f5; --white: #ffffff; --ink: #14262c; --slate: #5d7178; --line: #dfe6e6; --line-soft: #edf1f1;
  --ok: #0a7b5c; --ok-bg: #e6f3ee; --warn: #a15c07; --warn-bg: #fdf3e2; --err: #b23a2b;
  --display: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--mist); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
a { color: var(--teal); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
.notice { background: #8f2a1f; color: #fff; font-size: 13px; text-align: center; padding: 7px 16px; }

header.hero { background: var(--ocean); color: #fff; padding: 26px 0 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 400; font-size: 15px; letter-spacing: .02em; color: #b9cfd4; text-decoration: none; }
.langs { display: inline-flex; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 3px; }
.langs button { font: 600 13px var(--sans); background: none; border: 0; color: #cfe0e3; padding: 5px 13px; border-radius: 999px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: #fff; color: var(--ocean); }
.hero h1 { font-family: var(--display); font-weight: 300; font-size: clamp(34px, 5.4vw, 54px); line-height: 1.08; margin: 26px 0 10px; text-wrap: balance; }
.hero p.lede { color: #cfe0e3; max-width: 60ch; margin: 0 0 26px; font-size: 17px; }
.horizon { height: 3px; background: linear-gradient(90deg, transparent, var(--horizon) 18%, var(--horizon) 82%, transparent); }

main { padding: 34px 0 56px; }
.status { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 12px; }
.status-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.status-head h2 { font: 500 17px var(--display); margin: 0; }
.status-head span { color: var(--slate); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); display: inline-flex; gap: 6px; align-items: center; }
.chip.pending { background: var(--warn-bg); color: var(--warn); font-weight: 600; }

.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 22px; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.card .who { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.card h3 { font: 400 23px/1.2 var(--display); margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--slate); font-size: 15px; }
.card ul { margin: 2px 0 0; padding-left: 18px; color: var(--slate); font-size: 14px; }
.card .spacer { flex: 1; }
.btn { font: 600 15px var(--sans); background: var(--teal); color: #fff; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; text-decoration: none; text-align: center; display: inline-block; }
.btn:hover { background: #006f84; }
.btn.ghost { background: transparent; color: var(--teal); border: 1px solid var(--teal); }
.btn.ghost:hover { background: #e7f4f6; }
:focus-visible { outline: 3px solid var(--horizon); outline-offset: 2px; }
.card.results { background: var(--ocean); color: #fff; border-color: var(--ocean); }
.card.results .who { color: var(--horizon); }
.card.results p, .card.results ul { color: #cfe0e3; }
.card.results .btn { background: var(--horizon); color: var(--ocean); }

.panel { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 26px; max-width: 820px; }
.back { background: none; border: 0; color: var(--teal); font: 600 14px var(--sans); cursor: pointer; padding: 0; margin-bottom: 14px; }
.panel h2 { font: 400 28px/1.15 var(--display); margin: 0 0 6px; text-wrap: balance; }
.panel .sub { color: var(--slate); margin: 0 0 20px; max-width: 64ch; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }
label { font-weight: 600; font-size: 14px; }
label .opt { font-weight: 400; color: var(--slate); }
input, select { font: 400 16px var(--sans); color: var(--ink); background: #fff; border: 1px solid #c9d5d6; border-radius: 9px; padding: 10px 11px; width: 100%; }
input:focus, select:focus { border-color: var(--teal); }
.err-text { color: var(--err); font-size: 13px; }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--err); }
.help { color: var(--slate); font-size: 13px; }
fieldset { border: 0; padding: 0; margin: 22px 0 0; }
legend { font: 500 17px var(--display); margin-bottom: 10px; }
.rn { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rn th, .rn td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); text-align: right; }
.rn th:first-child, .rn td:first-child { text-align: left; }
.rn thead th { font-size: 13px; color: var(--slate); font-weight: 600; }
.rn input { text-align: right; max-width: 130px; margin-left: auto; display: block; padding: 8px 10px; }
.rn tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line); }
.rn td.total { color: var(--slate); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; align-items: center; }
.actions .help { flex: 1; min-width: 200px; }
.done { border-left: 4px solid var(--ok); background: var(--ok-bg); padding: 16px 18px; border-radius: 10px; margin-bottom: 18px; }
.done h3 { margin: 0 0 4px; font: 500 19px var(--display); color: var(--ok); }
.done p { margin: 0; }
.tbl-scroll { overflow-x: auto; }
.src input { font-size: 14px; }
.rn.seats { max-width: 420px; }

footer { color: var(--slate); font-size: 13px; padding: 0 0 36px; }
footer .wrap { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 4px; }

@media (max-width: 860px) { .cards { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .grid2 { grid-template-columns: 1fr; }
  .panel { padding: 20px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
